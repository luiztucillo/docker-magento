version: '3.8'
services:
    nginx:
      restart: always
      build:
        context: images/nginx
        args:
          username: ${USERNAME}
          domain: ${DOMAIN}
          cert_path: ${CERT_PATH}
          cert_key_path: ${CERT_KEY_PATH}
      container_name: magento_nginx
      volumes:
        - ./src:/var/www/html
        - ./images/nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
        - ./images/nginx/conf/application.conf:/etc/nginx/application.conf
        - ${CERT_PATH}:${CERT_PATH}
        - ${CERT_KEY_PATH}:${CERT_KEY_PATH}
      network_mode: host

    php:
      restart: always
      build:
        context: images/php
        dockerfile: Dockerfile-${PHP_VERSION}
        args:
          username: ${USERNAME}
          host_os: ${HOST_OS}
          domain: ${DOMAIN}
      container_name: magento_php
      volumes:
        - ./src:/var/www/html
        - ./sessions:/var/lib/php/sessions
        - ./credentials:/home/ubuntu/.composer
        # - ./adb-payment:/var/www/html/app/code/MercadoPago/AdbPayment
        # Next lines for php7.2
        - ./logs/php-fpm-error.log:/var/log/php-fpm/error-php-fpm.log
        - ./logs/php-fpm-access.log:/var/log/php-fpm/access-php-fpm.log
      network_mode: host

    mailhog:
      restart: always
      image: mailhog/mailhog
      container_name: magento_mailhog
      network_mode: host

    opensearch:
      restart: always
      image: opensearchproject/opensearch:3
      container_name: magento_opensearch
      network_mode: host
      environment:
        discovery.type: single-node
        network.host: "127.0.0.1"
        bootstrap.memory_lock: "true"
        OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        DISABLE_INSTALL_DEMO_CONFIG: "true"
        DISABLE_SECURITY_PLUGIN: "true"
      ulimits:
        memlock:
          soft: -1
          hard: -1
        nofile:
          soft: 65536
          hard: 65536
      volumes:
        - opensearch-data:/usr/share/opensearch/data
      healthcheck:
        test:
          - CMD-SHELL
          - "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"
        interval: 10s
        timeout: 10s
        retries: 12
        start_period: 60s

volumes:
  opensearch-data:
